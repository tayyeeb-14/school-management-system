<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900' preserveAspectRatio='xMidYMid slice'>
  <defs>
    <linearGradient id='g1' x1='0' x2='0' y1='0' y2='1'>
      <stop offset='0%' stop-color='#0b3fbf' stop-opacity='0.9'/>
      <stop offset='60%' stop-color='#2463d6' stop-opacity='0.9'/>
      <stop offset='100%' stop-color='#ffffff' stop-opacity='0.0'/>
    </linearGradient>
    <linearGradient id='sun' x1='0' x2='1'>
      <stop offset='0%' stop-color='#ffd27a'/>
      <stop offset='100%' stop-color='#ffb66b'/>
    </linearGradient>
  </defs>

  <rect width='100%' height='100%' fill='#f4f7fb'/>
  <!-- distant sky and soft sun -->
  <ellipse cx='1200' cy='120' rx='220' ry='80' fill='url(#sun)' opacity='0.26'/>

  <!-- Campus building -->
  <g transform='translate(160 180)'>
    <rect x='0' y='120' width='1180' height='420' rx='18' fill='#f9fafb' stroke='#e6eefc' stroke-width='2'/>
    <g transform='translate(40 30)'>
      <rect x='0' y='60' width='1100' height='40' rx='6' fill='#0b3fbf' opacity='0.08'/>
      <!-- windows rows -->
      <g fill='#eaf3ff'>
        <rect x='20' y='120' width='120' height='120' rx='6'/>
        <rect x='160' y='120' width='120' height='120' rx='6'/>
        <rect x='300' y='120' width='120' height='120' rx='6'/>
        <rect x='440' y='120' width='120' height='120' rx='6'/>
        <rect x='580' y='120' width='120' height='120' rx='6'/>
        <rect x='720' y='120' width='120' height='120' rx='6'/>
        <rect x='860' y='120' width='120' height='120' rx='6'/>
      </g>
      <rect x='20' y='260' width='980' height='8' rx='4' fill='#e6eefc' opacity='0.9'/>
    </g>
  </g>

  <!-- foreground lawn and paths -->
  <g transform='translate(0 560)'>
    <path d='M0 70 C300 10 1300 10 1600 70 L1600 250 L0 250 Z' fill='#e8f6e9'/>
    <path d='M120 80 C420 40 1180 40 1480 80' stroke='#dff0d8' stroke-width='18' fill='none' stroke-linecap='round' opacity='0.9'/>
  </g>

  <!-- silhouettes of students/teachers (simple but realistic forms) -->
  <g transform='translate(220 520) scale(0.9)'>
    <g fill='#1b2430'>
      <!-- adult teacher -->
      <path d='M80 50 c0 -26 20 -24 22 -24 l8 0 c6 0 22 2 22 24 v56 h-52z' opacity='0.95'/>
      <circle cx='95' cy='26' r='12' fill='#fff' opacity='0.12'/>
      <!-- child 1 -->
      <path d='M180 70 c0 -18 14 -16 16 -16 l6 0 c4 0 14 2 14 16 v40 h-36z' opacity='0.95'/>
      <circle cx='192' cy='54' r='10' fill='#fff' opacity='0.1'/>
      <!-- child 2 holding a book -->
      <path d='M260 68 c0 -16 12 -14 14 -14 l5 0 c3 0 12 2 12 14 v40 h-34z' opacity='0.95'/>
      <rect x='270' y='86' width='20' height='10' rx='2' fill='#fff' opacity='0.12' transform='rotate(-8 280 91)'/>
    </g>
  </g>

  <!-- soft overlay for premium darkening effect (hero dark overlay) -->
  <rect width='100%' height='100%' fill='url(#g1)' opacity='0.32'/>
</svg>